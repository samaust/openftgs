# SPDX-License-Identifier: Apache-2.0
# CI for the CPU suite (§3 introduction) with its coverage (Q-216), and the license scan (§2.3 notes;
# Q-4). The test job runs on Python 3.11, the floor, beside 3.14 (Q-1, Q-29: the M18 CI matrix).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.job }} (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: [lint, test, licenses, wheel]
        python: ["3.14"]
        # It would overwrite an original value, so it is a combination of its own (Q-1, Q-29).
        include:
          - job: test
            python: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}  # Q-1
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            harness/pyproject.toml
      - name: Install CPU torch, then the packages (Q-3)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          # The test job imports the vendored RoMa (U-38, Q-117); the license job scans [init] (Q-4).
          python -m pip install -e ".[dev${{ (matrix.job == 'test' || matrix.job == 'licenses') && ',init' || '' }}]" -e "harness[torch]"
      - name: Lint and type-check
        if: matrix.job == 'lint'
        run: |
          ruff check .
          ruff format --check .
          mypy
      - name: CPU tests
        if: matrix.job == 'test'
        run: >-
          pytest -n auto --dist loadgroup -m "not gpu and not dataset and not weights"
          --cov --cov-report=xml --cov-report=html
      - name: Coverage summary (Q-216; no threshold)
        if: matrix.job == 'test' && !cancelled()
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the coverage reports
        if: matrix.job == 'test' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}  # v4's artifacts are immutable: one per job
          path: |
            coverage.xml
            htmlcov/
      - name: License scan (GPL, AGPL, non-commercial fail; others need a sign-off)
        if: matrix.job == 'licenses'
        run: python scripts/license_scan.py
      - name: Build the wheels and check their contents
        if: matrix.job == 'wheel'
        run: |
          python -m pip wheel . ./harness --no-deps -w dist
          python - <<'PY'
          import email, glob, hashlib, json, re, zipfile
          wheel = zipfile.ZipFile(glob.glob("dist/openftgs-*.whl")[0])
          names = wheel.namelist()
          for required in ("openftgs/py.typed", "licenses/LICENSE", "licenses/NOTICE"):
              assert any(n.endswith(required) for n in names), required
          assert not any(n.startswith("ftgs_harness/") for n in names), "Q-5"
          # D-65, Q-115, Q-118: the vendored RoMa ships with its license files and VENDOR.json,
          # and so does the vendored ꟻLIP (D-89, #383).
          for vendored, licenses, files in (
              ("openftgs/_vendor/romatch/", 8, 22),
              ("openftgs/_vendor/flip/", 1, 1),
          ):
              record = json.loads(wheel.read(vendored + "VENDOR.json"))
              assert [e["path"] for e in record["licenses"]][0] == "LICENSE"
              assert len(record["licenses"]) == licenses and len(record["files"]) == files
              for entry in record["licenses"] + record["files"]:
                  digest = hashlib.sha256(wheel.read(vendored + entry["path"])).hexdigest()
                  assert digest == entry["sha256"], entry["path"]
          # Q-248, §2.3 (#393): the core requires no lpips, no tqdm and none of the [init]
          # extra's packages, which only RoMa and the DINO networks need; no extra names lpips
          # or torchmetrics. Q-T370.1: tqdm is [init]'s alone, for XFeat's hub code (Tiny RoMa).
          metadata = wheel.read(next(n for n in names if n.endswith(".dist-info/METADATA")))
          requires = [
              line.split(":", 1)[1].strip()
              for line in metadata.decode("utf-8").splitlines()
              if line.startswith("Requires-Dist:")
          ]
          named = lambda r: re.sub(r"[-_.]+", "-", re.match(r"[A-Za-z0-9._-]+", r)[0]).lower()
          core = {named(r) for r in requires if not re.search(r"\bextra\s*==", r)}
          init = {named(r) for r in requires if re.search(r"\bextra\s*==\s*['\"]init['\"]", r)}
          assert not core & {"torchvision", "einops", "loguru", "lpips", "tqdm"}, sorted(core)
          assert {"torchvision", "einops", "loguru", "tqdm"} <= init, sorted(init)
          assert not {named(r) for r in requires} & {"lpips", "torchmetrics"}, requires
          other_extras = {
              named(r) for r in requires
              if re.search(r"\bextra\s*==", r)
              and not re.search(r"\bextra\s*==\s*['\"]init['\"]", r)
          }
          assert "tqdm" not in other_extras, requires
          # Q-244 (#370): PEP 639's license expression and no license classifier, Q-244's
          # classifiers among them, and the project URLs.
          headers = email.message_from_bytes(metadata)
          assert headers["License-Expression"] == "Apache-2.0", headers["License-Expression"]
          classifiers = headers.get_all("Classifier", [])
          assert not [c for c in classifiers if c.startswith("License ::")], classifiers
          assert "Development Status :: 3 - Alpha" in classifiers, classifiers
          labels = {u.split(",", 1)[0] for u in headers.get_all("Project-URL", [])}
          assert labels == {"Homepage", "Source", "Documentation", "Issues", "Changelog"}, labels
          wheel = zipfile.ZipFile(glob.glob("dist/ftgs_harness-*.whl")[0])
          names = wheel.namelist()
          for required in ("ftgs_harness/py.typed", "licenses/LICENSE"):
              assert any(n.endswith(required) for n in names), required
          assert not any(n.startswith("openftgs/") for n in names), "Q-5"
          # Q-254 (#391): the harness's own ꟻLIP ships with its license and provenance record.
          vendored = "ftgs_harness/_vendor/flip/"
          record = json.loads(wheel.read(vendored + "VENDOR.json"))
          assert [e["path"] for e in record["licenses"]] == ["LICENSE"]
          for entry in record["licenses"] + record["files"]:
              digest = hashlib.sha256(wheel.read(vendored + entry["path"])).hexdigest()
              assert digest == entry["sha256"], entry["path"]
          print("wheel contents ok")
          PY

# SPDX-License-Identifier: Apache-2.0
# CI for the CPU suite (§3 introduction) with its coverage (Q-216), and the license scan (§2.3 notes;
# Q-4).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: [lint, test, licenses, wheel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # Q-1
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            harness/pyproject.toml
      - name: Install CPU torch, then the packages (Q-3)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          # The test job imports the vendored RoMa (U-38, Q-117); the license job scans [init] (Q-4).
          python -m pip install -e ".[dev${{ (matrix.job == 'test' || matrix.job == 'licenses') && ',init' || '' }}]" -e "harness[lpips]"
      - name: Lint and type-check
        if: matrix.job == 'lint'
        run: |
          ruff check .
          ruff format --check .
          mypy
      - name: CPU tests
        if: matrix.job == 'test'
        run: >-
          pytest -n auto --dist loadgroup -m "not gpu and not dataset and not weights"
          --cov --cov-report=xml --cov-report=html
      - name: Coverage summary (Q-216; no threshold)
        if: matrix.job == 'test' && !cancelled()
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the coverage reports
        if: matrix.job == 'test' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
      - name: License scan (GPL, AGPL, non-commercial fail; others need a sign-off)
        if: matrix.job == 'licenses'
        run: python scripts/license_scan.py
      - name: Build the wheels and check their contents
        if: matrix.job == 'wheel'
        run: |
          python -m pip wheel . ./harness --no-deps -w dist
          python - <<'PY'
          import glob, hashlib, json, zipfile
          wheel = zipfile.ZipFile(glob.glob("dist/openftgs-*.whl")[0])
          names = wheel.namelist()
          for required in ("openftgs/py.typed", "licenses/LICENSE", "licenses/NOTICE"):
              assert any(n.endswith(required) for n in names), required
          assert not any(n.startswith("ftgs_harness/") for n in names), "Q-5"
          # D-65, Q-115, Q-118: the vendored RoMa ships with its license files and VENDOR.json,
          # and so does the vendored ꟻLIP (D-89, #383).
          for vendored, licenses, files in (
              ("openftgs/_vendor/romatch/", 8, 22),
              ("openftgs/_vendor/flip/", 1, 1),
          ):
              record = json.loads(wheel.read(vendored + "VENDOR.json"))
              assert [e["path"] for e in record["licenses"]][0] == "LICENSE"
              assert len(record["licenses"]) == licenses and len(record["files"]) == files
              for entry in record["licenses"] + record["files"]:
                  digest = hashlib.sha256(wheel.read(vendored + entry["path"])).hexdigest()
                  assert digest == entry["sha256"], entry["path"]
          wheel = zipfile.ZipFile(glob.glob("dist/ftgs_harness-*.whl")[0])
          names = wheel.namelist()
          for required in ("ftgs_harness/py.typed", "licenses/LICENSE"):
              assert any(n.endswith(required) for n in names), required
          assert not any(n.startswith("openftgs/") for n in names), "Q-5"
          # Q-254 (#391): the harness's own ꟻLIP ships with its license and provenance record.
          vendored = "ftgs_harness/_vendor/flip/"
          record = json.loads(wheel.read(vendored + "VENDOR.json"))
          assert [e["path"] for e in record["licenses"]] == ["LICENSE"]
          for entry in record["licenses"] + record["files"]:
              digest = hashlib.sha256(wheel.read(vendored + entry["path"])).hexdigest()
              assert digest == entry["sha256"], entry["path"]
          print("wheel contents ok")
          PY

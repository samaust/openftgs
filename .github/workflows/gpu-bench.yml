# SPDX-License-Identifier: Apache-2.0
# The GPU benchmarks of §3.4: B-2 to B-6 on the generated CI scene, each budgeted figure compared
# with its stored baseline (Q-170). Started only by hand, never on pushes or pull requests, on a
# self-hosted GPU runner (Q-179): it stays dormant until the owner registers a runner with the
# labels below. docs/modules/cli/benchmarks.md, "The GPU CI job", says how to set one up.
name: GPU benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: B-2 to B-6 against the baselines
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 120
    env:
      # The runner's Python, with a CUDA build of torch, gsplat, lpips and fused-ssim installed as
      # the README says; the checked-out openftgs comes first on its path.
      FTGS_PYTHON: ${{ vars.FTGS_CI_PYTHON }}
      # Where the scene is generated, outside the workspace, with room for its PNGs and the
      # frame caches B-6 builds beside them (about 40 GB); empty: the runner's temporary folder.
      FTGS_SCENE: ${{ vars.FTGS_CI_SCENE }}
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - name: Check the runner's Python and GPU
        run: |
          if [ -z "$FTGS_PYTHON" ]; then
            echo "Set the repository variable FTGS_CI_PYTHON to the runner's Python." >&2
            exit 2
          fi
          echo "FTGS_SCENE=${FTGS_SCENE:-$RUNNER_TEMP/ci-scene}" >> "$GITHUB_ENV"
          "$FTGS_PYTHON" - <<'PY'
          import fused_ssim, gsplat, lpips, torch  # B-4 needs fused-ssim for its fused case
          import openftgs
          assert torch.cuda.is_available(), "no CUDA device"
          print(openftgs.__file__, torch.__version__, torch.cuda.get_device_name())
          PY
      - name: Generate the CI scene (kept between runs when the folder persists)
        run: '"$FTGS_PYTHON" scripts/ci_scene.py "$FTGS_SCENE"'
      - name: B-2 to B-6
        run: |
          bench() { "$FTGS_PYTHON" -m openftgs.cli bench "$@"; }
          mkdir -p bench
          bench raster "$FTGS_SCENE/scene.json" --out bench/B-2-raster.json
          bench slice "$FTGS_SCENE/scene.json" --out bench/B-3-slice.json
          bench losses "$FTGS_SCENE/scene.json" --out bench/B-4-losses.json
          bench adam "$FTGS_SCENE/scene.json" --out bench/B-5-adam.json
          bench data "$FTGS_SCENE/scene.json" --out bench/B-6-data.json
          # Q-178: the GPU placement of the frame cache on the first 60 frames.
          bench data "$FTGS_SCENE/scene-60.json" --out bench/B-6-data-60.json
      - name: Keep the BENCH.json files
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench/
          if-no-files-found: ignore
      - name: Compare with the baselines (Q-170)
        run: '"$FTGS_PYTHON" scripts/bench_compare.py bench --baselines benchmarks/baselines'

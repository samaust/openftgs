# SPDX-License-Identifier: Apache-2.0
# The documentation site (PRD #355), built as Read the Docs builds it (.readthedocs.yaml): Python
# 3.11, the floor (Q-1), CPU torch from the PyTorch CPU index (Q-3), then the package with its
# `docs` dependency group (Q-241), and Sphinx with warnings as errors. linkcheck runs locally
# only, since the network makes it flaky (docs/contributing.md).
name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  html:
    name: Sphinx HTML (3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # Q-1
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU torch, then the package with the docs group (Q-3, Q-241)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install . --group docs
      - name: Build the HTML, every warning an error (nitpicky)
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - name: Keep the HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html/
          if-no-files-found: error
      # CI's lint job runs mypy without Sphinx, so docs/conf.py is checked here, where Sphinx is
      # installed; mypy is a dev tool already (§2.3), installed after the build so the build's
      # environment stays the one Read the Docs has.
      - name: Type-check docs/conf.py
        run: |
          python -m pip install mypy
          mypy docs/conf.py
